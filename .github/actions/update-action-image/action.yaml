name: update-action-image

inputs:
  action_image:
    description: Docker image reference to write into action.yml
    required: true

runs:
  using: composite
  steps:
    - name: Update action.yml image reference
      shell: bash
      env:
        ACTION_IMAGE: ${{ inputs.action_image }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path

        path = Path("action.yml")
        lines = path.read_text().splitlines()
        action_image = os.environ["ACTION_IMAGE"]
        in_runs = False
        runs_indent = None
        image_index = None
        image_indent = None

        for index, line in enumerate(lines):
            stripped = line.lstrip()
            indent = len(line) - len(stripped)

            if not in_runs:
                if stripped == "runs:":
                    in_runs = True
                    runs_indent = indent
                continue

            if stripped and indent <= runs_indent:
                break

            if stripped.startswith("image:") and (
                image_indent is None or indent < image_indent
            ):
                image_index = index
                image_indent = indent

        if image_index is None:
            raise SystemExit(
                "Failed to update action.yml: expected a top-level runs.image entry within the runs block"
            )

        stripped = lines[image_index].lstrip()
        comment = ""
        if " #" in stripped:
            comment = stripped[stripped.index(" #") :]
        lines[image_index] = f"{' ' * image_indent}image: '{action_image}'{comment}"
        path.write_text("\n".join(lines) + "\n")
        PY
