name: update-action-image

inputs:
  action_image:
    description: Docker image reference to write into action.yml
    required: true

runs:
  using: composite
  steps:
    - name: Update action.yml image reference
      shell: bash
      env:
        ACTION_IMAGE: ${{ inputs.action_image }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path

        path = Path("action.yml")
        lines = path.read_text().splitlines()
        action_image = os.environ["ACTION_IMAGE"]
        in_runs = False
        runs_indent = None
        updated = False

        for index, line in enumerate(lines):
            stripped = line.lstrip()
            indent = len(line) - len(stripped)

            if not in_runs:
                if stripped == "runs:":
                    in_runs = True
                    runs_indent = indent
                continue

            if stripped and indent <= runs_indent:
                break

            if stripped.startswith("image:"):
                lines[index] = f"{' ' * indent}image: '{action_image}'"
                path.write_text("\n".join(lines) + "\n")
                updated = True
                break

        if not updated:
            raise SystemExit("Failed to update runs.image in action.yml")
        PY
