name: build-and-deploy-image

outputs:
  action_image:
    description: Docker image reference for the freshly built action image
    value: ${{ steps.image_ref.outputs.action_image }}

inputs:
  registry:
    description: The registry to deploy to
    required: true
  image_name:
    description: The name of the docker image
    required: true
  username:
    description: The username to login to the container registry
    required: true
  password:
    description: The password to login to the container registry
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: type=sha,format=long

    - name: Prepare action image reference
      id: image_ref
      shell: bash
      env:
        METADATA_JSON: ${{ steps.meta.outputs.json }}
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        metadata = json.loads(os.environ["METADATA_JSON"])
        tags = metadata.get("tags", [])
        if len(tags) != 1:
            raise SystemExit(
                f"Expected exactly one metadata-action tag for the action image, got {len(tags)}"
            )

        output = Path(os.environ["GITHUB_OUTPUT"])
        with output.open("a", encoding="utf-8") as handle:
            handle.write(f"action_image=docker://{tags[0]}\n")
        PY

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}