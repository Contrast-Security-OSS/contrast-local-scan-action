name: build-and-deploy-image

outputs:
  action_image:
    description: Docker image reference for the freshly built action image
    value: ${{ steps.image_ref.outputs.action_image }}

inputs:
  registry:
    description: The registry to deploy to
    required: true
  image_name:
    description: The name of the docker image
    required: true
  username:
    description: The username to login to the container registry
    required: true
  password:
    description: The password to login to the container registry
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: type=sha,format=long

    - name: Prepare action image reference
      id: image_ref
      shell: bash
      run: |
        registry="$(printf '%s' '${{ inputs.registry }}' | tr '[:upper:]' '[:lower:]')"
        image_name="$(printf '%s' '${{ inputs.image_name }}' | tr '[:upper:]' '[:lower:]')"
        image_tag="${registry}/${image_name}:sha-$(git rev-parse HEAD)"
        {
          echo "image_tag=${image_tag}"
          echo "action_image=docker://${image_tag}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: .
        push: true
        tags: ${{ steps.image_ref.outputs.image_tag }}
        labels: ${{ steps.meta.outputs.labels }}