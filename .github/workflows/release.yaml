name: Release local scanner action

on:
  push:
    branches:
      - 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  checks: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install modules
        run: npm ci
      - name: eslint
        run: npm run lint:check

  build-action-docker-image:
    needs: [ lint ]
    runs-on: ubuntu-latest
    outputs:
      action_image: ${{ steps.build_image.outputs.action_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        id: build_image
        name: Build and publish docker image
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify-action:
    runs-on: ubuntu-latest
    needs: [ build-action-docker-image ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Point action.yml at new image
        env:
          IMAGE_TAG: docker://${{ needs.build-action-docker-image.outputs.action_image }}
        run: yq e '.runs.image = env(IMAGE_TAG)' -i action.yml
      - uses: ./
        name: Run action against itself
        with:
          apiUrl: ${{ secrets.CONTRAST__API__URL }}
          apiUserName: ${{ secrets.CONTRAST__API__USER_NAME }}
          apiKey: ${{ secrets.CONTRAST__API__API_KEY }}
          apiServiceKey: ${{ secrets.CONTRAST__API__SERVICE_KEY }}
          apiOrgId: ${{ secrets.CONTRAST__API__ORGANIZATION }}
          severity: medium
          path: src

  release:
    runs-on: ubuntu-latest
    needs: [ build-action-docker-image, verify-action ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'SvcGitHubAPIAccessToken'
          git config user.email 'github@users.noreply.github.com'
      - name: Create release branch
        run: |
          RELEASE_BRANCH="auto/release-${GITHUB_SHA::7}"
          git checkout -b "${RELEASE_BRANCH}"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"
      - name: Install modules
        run: npm ci
      - name: Bump version and update changelog
        run: npx release-it --ci --no-git.push --no-git.tag --no-github.release
      - name: Fold action.yml image update into release commit
        env:
          IMAGE_TAG: docker://${{ needs.build-action-docker-image.outputs.action_image }}
        run: |
          yq e '.runs.image = env(IMAGE_TAG)' -i action.yml
          git add action.yml
          git commit --amend --no-edit
      - name: Tag and push release branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          git tag "v${VERSION}"
          git push origin "${RELEASE_BRANCH}"
          git push origin "v${VERSION}"
      - name: Open and merge release PR
        env:
          GH_TOKEN: ${{ secrets.REPOS_AUTO_INCREMENT_PAT }}
        run: |
          gh pr create \
            --title "[Auto] Release ${VERSION} [skip ci]" \
            --body "Automated release: version bump and Docker image tag update." \
            --base main \
            --head "${RELEASE_BRANCH}"
          gh pr merge "${RELEASE_BRANCH}" --merge --yes
